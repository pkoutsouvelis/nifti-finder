[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifti-finder"
version = "2.0.1"
description = "Flexible file explorers and filters for navigating neuroimaging datasets and beyond."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    {name = "Petros Koutsouvelis"},
]
dependencies = [
  "tqdm>=4.66,<5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Utilities",
]
keywords = [
    "nifti",
    "bids",
    "neuroimaging",
    "file system",
    "data discovery",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "jupyter>=1.0.0",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
    "black",
    "docformatter",
    "interrogate",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nifti_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

# Star-import re-export barrels; submodule `__all__` defines the public API (F403/F405 are false positives).
[tool.ruff.lint.per-file-ignores]
"src/nifti_finder/__init__.py" = ["F403", "F405"]
"src/nifti_finder/explorers/__init__.py" = ["F403", "F405"]
"src/nifti_finder/filters/__init__.py" = ["F403", "F405"]
"src/nifti_finder/utils/__init__.py" = ["F403", "F405"]
"tests/**/*.py" = ["F403", "F405"]

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88
black = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = true
ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["build", "dist", ".venv", "tests"]
verbose = 1
quiet = false
color = true

[project.urls]
Homepage = "https://github.com/pkoutsouvelis/nifti-finder"
Repository = "https://github.com/pkoutsouvelis/nifti-finder"
Issues = "https://github.com/pkoutsouvelis/nifti-finder/issues"
